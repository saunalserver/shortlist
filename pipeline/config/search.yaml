                     analytics, "data analyst", success, support, partnerships, enablement, implementation]
  himalayas:
    enabled: true
    # locationRestrictions is an explicit residency list. User rule 2026-09-28: only remote jobs doable from
    # Vancouver — so EU country passes (FR/DE/GB… lists without Canada) add nothing; tried and reverted.
    # CA pass = lists that include Canada; worldwide pass = no restriction. exclude_worldwide keeps them distinct.
    countries: [CA]
    exclude_worldwide: true
    worldwide: true
    params: { sort: recent, seniority: "Entry-level,Mid-level", employment_type: "Full Time" }
    max_queries: 40            # 2 passes now (CA + worldwide), 10 s total — run the whole master list
