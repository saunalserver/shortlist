    enabled: false              # 2026-10-06: 18k fetches → 381 new → 4 queued (1.05%) → 0 applied, 16 LLM/queued — worst yield per call in the funnel
    result_limit: 100
    pages: 2
    passes:                    # 2026-09-08 "both": local + Canada-wide (API has no remote flag; prefilter kills on-site non-Vancouver)
