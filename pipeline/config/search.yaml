    # Kept: title matches workday.title_keywords (override with title_keywords:) AND Vancouver area
    # or remote-in-Canada. Add an employer: its careers host must answer /services/rss/job/.
    keywords: [operations, coordinator, analyst, specialist, associate, vancouver, remote]
    delay_s: 0.5
    tenants:
