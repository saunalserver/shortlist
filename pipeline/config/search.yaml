sources:
  # ---- Aggregators / boards ------------------------------------------------
  adzuna:                      # free key; best Canada-wide coverage
    enabled: true
    match: title               # title = query words must appear in the job title (6 results instead of 93 for
                               # "operations coordinator", almost all relevant); any = anywhere in the posting
    where: [Vancouver, Canada] # 2026-09-08 "both": 50 km local radius + country-wide (distance applies to the
                               # city pass only; on-site non-Vancouver rows die in the prefilter, pre-scrape)
    distance_km: 50
    pages: 2
    results_per_page: 50
    max_days_old: 7
  jooble:                      # free key, 500 requests total → few queries
    enabled: true
    location: "Vancouver, BC"
    radius_km: 50
    max_queries: 6
  boards:                      # LinkedIn + Indeed (+ ZipRecruiter, Glassdoor) via python-jobspy (no key)
    enabled: true
    sites: [linkedin, indeed, zip_recruiter, glassdoor]   # zip/glassdoor returned 0 from this IP on 2026-09-07 — audit in 2 weeks
    country_indeed: canada
    results_per_query: 35      # 2026-09-06: 25→35 for deeper per-query sweep toward the 1000/day goal (Indeed paginates fine; LinkedIn caps itself ~25)
    hours_old: 120            # 5 days: a posting missed one day (rate limit, cap) gets another chance
    locations:                 # 2026-09-08 "both": local pass unchanged + Canada-wide remote pass
      - location: "Vancouver, BC"
      - location: "Canada"     # keeps only remote-flagged rows (or "remote" in the location string) so
        remote_only: true      # Toronto/Calgary on-site never costs a scrape or LLM call
        max_queries: 12        # first 12 master queries (best volume-to-fit)
        results_per_query: 20
        linkedin_fetch_description: false   # skip LinkedIn's slow per-job fetch; survivors get scraped post-prefilter
    max_queries: 20            # raised from 10 on 2026-09-02 so the whole list rotates in (city pass)
  jobbank:                     # Government of Canada Job Bank (HTML)
    enabled: false              # dead 2026-09-07: 43 jobs / 0 queued in 4 days
    location: "Vancouver, BC"
    max_queries: 8
  serper:                      # Google via serper.dev — paid credits, and we now spend them freely
    enabled: true
    queries_per_run: 48        # ≈48 credits/day; full plan rotation in ~4–5 days (raised 2026-09-07 from 12)
    # No own query list: falls back to the 28 master queries above, so each plan step
    # sweeps the whole list — 8 steps × 28 queries = 224 searches per rotation.
    results_per_query: 10        # num>10 gets 400s on site:-scoped queries — keep 10, volume comes from queries_per_run
    recency: qdr:w             # past week
    # Rotating query plan: each run takes the next `queries_per_run` items, so coverage
    # cycles through all of them over a few days.
    # ATS domains are worldwide, so each search is scoped to Canada/Vancouver (unscoped, 98 of 99 results
    # were US/India/China Workday postings that all scored 1–3).
    plan:
      - { suffix: "site:jobs.lever.co (Vancouver OR Canada)", queries: default }
      - { suffix: "(site:boards.greenhouse.io OR site:job-boards.greenhouse.io) (Vancouver OR Canada)", queries: default }
      - { suffix: "site:jobs.ashbyhq.com (Vancouver OR Canada)", queries: default }
      - { suffix: "(site:apply.workable.com OR site:jobs.smartrecruiters.com) (Vancouver OR Canada)", queries: default }
      - { suffix: "site:myworkdayjobs.com Vancouver", queries: default }
      - { suffix: "site:wellfound.com/jobs (Vancouver OR Canada)", queries: default }
      # T-Net (bctechnology.com) direct fetch is Cloudflare-walled; this is the documented fallback (1 credit/query)
      - { suffix: "site:bctechnology.com", queries: default }
      - { suffix: "Vancouver", queries: default }
      - { suffix: "remote Canada", queries: default }

  # ---- Remote-first boards (no key) ---------------------------------------
  remotive:
    enabled: false              # dead 2026-09-07: 18 jobs / 0 queued, avg score 2.0
    limit_per_query: 20
  remoteok:
    enabled: false              # dead 2026-09-07: 38 jobs / 0 queued, avg score 1.5
    tags: [operations, ops, support, success, project-management, management, business, analyst, non-tech]
  jobicy:
    enabled: false              # dead 2026-09-07: 91 jobs / 1 queued
    geo: canada
    tags: [business, project-management, admin, marketing]   # Jobicy "industry" slugs
    count: 50
  themuse:
    enabled: false              # dead 2026-09-07: 68 jobs / 0 queued, avg score 2.6
    categories: ["Business Operations", "Project Management", "Data and Analytics"]
    locations: ["Vancouver, Canada", "Flexible / Remote"]
    levels: [entry, mid]      # The Muse levels: internship, entry, mid, senior, management
    pages: 3
  weworkremotely:
    enabled: true
    feeds:
      - remote-management-and-finance-jobs
      - remote-product-jobs

  amazon:                     # amazon.jobs public JSON (no key, full descriptions inline — zero scrapes)
    enabled: true
    city: Vancouver
    result_limit: 100
    pages: 2

  hn:                         # HN "Who is hiring" monthly thread via Algolia (~2 requests/month)
    enabled: true
    title_keywords: [operations, coordinator, program, project, "chief of staff", "business analyst",
                     analytics, "data analyst", success, support, partnerships, enablement, implementation]
  himalayas:
    enabled: true
    countries: [CA]
    worldwide: true
    pages_per_query: 2
    results_per_page: 20
    skip_seniority: [Director, Executive, VP, C-Level]   # Himalayas' own label; "Senior" is left to the title rules

  # ---- Vancouver employers on Workday (no key) ------------------------------
  # Workday's public job-board API: POST …/wday/cxs/<tenant>/<site>/jobs. Big local employers (UBC, Aritzia…)
  # live here and nowhere else. Find a tenant's site name in its careers URL:
  # https://<tenant>.<wd>.myworkdayjobs.com/<site>/… ; test with `autojob sources test workday`.
  workday:
    enabled: true
    queries: [operations, coordinator, analyst, associate, specialist, "business analyst", "project coordinator",
              implementation, solutions, "customer success", partnerships, reporting]
    pages_per_query: 2         # Workday returns 20 postings per page
    max_details_per_run: 60    # full descriptions fetched per run (one request each; only for new, relevant postings)
    title_keywords: [operations, " ops", "ops ", coordinator, analyst, associate, specialist, generalist,
                     "chief of staff", "business analyst", "project", "program", enablement, automation, workflow,
                     implementation, onboarding, strategy, administrator, "systems", "process", planning,
                     solutions, success, partnerships, reporting]
    tenants:
      - { tenant: ubc, wd: wd10, site: ubcstaffjobs, name: "University of British Columbia" }
      - { tenant: aritzia, wd: wd3, site: External, name: Aritzia }
      - { tenant: stemcell, wd: wd3, site: External_Careers, name: "STEMCELL Technologies" }
      # 2026-09-07 expansion (serper discovery + identity/location-verified; scripts note in docs/):
      # banks/insurers (ops + analyst volume, mostly Toronto-remote filtered per job)
      - { tenant: rbc, wd: wd3, site: RBCGLOBAL1, name: RBC }
      - { tenant: td, wd: wd3, site: TD_Bank_Careers, name: "TD Bank" }
      - { tenant: bmo, wd: wd3, site: External, name: BMO }
      - { tenant: cibc, wd: wd3, site: search, name: CIBC }
      - { tenant: manulife, wd: wd3, site: MFCJH_Jobs, name: Manulife }
      - { tenant: sunlife, wd: wd3, site: Experienced-Jobs, name: "Sun Life" }
      - { tenant: desjardins, wd: wd10, site: Desjardins, name: Desjardins }
      - { tenant: lifeworks, wd: wd3, site: External, name: "TELUS Health" }
      # BC/Canada employers
      - { tenant: bestbuycanada, wd: wd3, site: BestBuyCA_Career, name: "Best Buy Canada" }
      - { tenant: pfg, wd: wd3, site: SaveonfoodsCareers, name: "Save-On-Foods" }
      - { tenant: bcaa, wd: wd3, site: bcaacareers, name: BCAA }
      - { tenant: clio, wd: wd3, site: ClioCareerSite, name: Clio }
      - { tenant: magna, wd: wd3, site: Magna, name: "Magna International" }
      - { tenant: enbridge, wd: wd3, site: enbridge_careers, name: Enbridge }
      - { tenant: suncor, wd: wd1, site: Suncor_External, name: Suncor }
      - { tenant: agecare, wd: wd10, site: AgeCare_Careers_External, name: AgeCare }
      - { tenant: navcanada, wd: wd10, site: NAV_Careers, name: "NAV CANADA" }
      - { tenant: churchdwight, wd: wd1, site: chdcanadacareers, name: "Church & Dwight Canada" }

  # ---- Eluta.ca — Canadian aggregator, Vancouver radius (no key) ------------
  # Job pages are bot-walled, so these are scored from the search snippet only (low confidence). Kept because it
  # indexes employer career sites (health authorities, biotech, engineering firms) that the big boards miss.
  eluta:
    enabled: true
    location: "Vancouver, BC"
    max_queries: 6
    pages: 1                   # 10 results per page

  # ---- Company career pages via their ATS APIs (no key) --------------------
  # Run `autojob companies verify` to check slugs, or `autojob companies probe <name>` to add.
  ats_companies:
    enabled: true
    max_jobs_per_company: 15
    use_discovered_boards: true   # boards verified Canada-relevant in the ats_boards table
                                 # (scripts/expand_ats_boards.py — LastRound AI ATS Directory, CC BY 4.0,
                                 # datahub.io/lastroundai-hiring-data, DOI 10.6084/m9.figshare.33154145)
    # Phrase-level on purpose: bare words like "analyst" match half of a big company's board.
    title_keywords: [operations, " ops", "ops ", bizops, revops, coordinator, "chief of staff",
                     "business analyst", "strategy & ops", "strategy and ops", "strategy & operations",
                     enablement, "implementation specialist", "onboarding specialist", automation,
                     "program associate", "project associate", "workflow",
                     # non-"operations" titles worth catching (added 2026-09-02)
                     solutions, "technical account", "customer success", "data analyst", "systems analyst",
