  getro:                      # Getro-powered VC portfolio job boards (EU + Canada funds)
    enabled: true
    # POST api.getro.com/api/v2/collections/<id>/search/jobs. Board id = __NEXT_DATA__ network.id on <host>/jobs.
    # mode remote: remote jobs open to a Vancouver resident — locations empty/plain "Remote" or naming
    #   Canada/North America/Americas/worldwide. Remote pinned to Europe/a country = residency → dropped.
    # mode canada: Vancouver-area any work mode + remote located in Canada.
