  # ---- 2026-09-28 sourcing expansion (see docs/RESEARCH-sources-*-2026-09-28.md) ----
  workable_search:            # jobs.workable.com cross-company search (every Workable employer, no key)
    enabled: true
    day_range: 7               # server-side "posted in the last N days" (sort is ignored by the API)
    max_queries: 16            # first N of the master query list, per pass
    max_pages: 3               # 20 rows/page; only the Europe pass ever needs more than one
    pause_s: 0.8               # undocumented endpoint — stay ~1 req/s
    passes:
      - { location: Vancouver, country: Canada }                 # any workplace (on-site/hybrid/remote)
      - { location: Canada, workplace: remote }
      # Europe/France remote passes removed 2026-09-28 after review: 18 of 26 rows, ~all junk (agency listings,
      # Serbian/Romanian language-support roles). Re-add as { location: Europe, workplace: remote, europe_only: true }.
    title_keywords: [operations, " ops", "ops ", coordinator, analyst, associate, specialist, generalist,
                     "chief of staff", "project", "program", enablement, automation, workflow, implementation,
                     onboarding, strategy, "process", planning, solutions, success, partnerships, reporting,
                     "supply chain", procurement, logistics, revops, bizops]
  wttj:                       # Welcome to the Jungle public Algolia index (FR full-remote + Canada offices)
    enabled: true
    max_days_old: 7            # published_at filter (server-side)
    max_experience_years: 3    # drop postings whose minimum experience is above this (missing = kept)
    hits_per_page: 200
    max_pages: 3
    # "*" = sweep everything the pass filters allow, then keep titles matching title_keywords.
    # Full-remote France is ~130 postings/week, so one sweep per pass beats many keyword queries.
    queries: ["*"]
    passes:
      - name: france-remote
        filters: "remote:fulltime AND contract_type:full_time AND offices.country_code:FR"
        country_codes: [FR]
      # europe-remote pass (BE/ES/DE/GB/NL/LU/CH/PT/IT/IE offices) removed 2026-09-28 after review: mostly
      # German-/DACH-/SEUR-speaking roles bound to that market.
      - name: canada-remote
        filters: "remote:fulltime AND contract_type:full_time AND offices.country_code:CA"
        country_codes: [CA]
      - name: vancouver              # any remote mode
        filters: "contract_type:full_time AND offices.country_code:CA AND (offices.city:Vancouver OR offices.city:Burnaby OR offices.city:Richmond OR offices.city:Surrey OR offices.city:\"North Vancouver\" OR offices.city:\"New Westminster\")"
        office_cities: [Vancouver, Burnaby, Richmond, Surrey, North Vancouver, New Westminster]
        country_codes: [CA]
    title_keywords: [operations, opérations, " ops", "ops ", revops, bizops, "growth", coordinator, coordinateur,
                     coordinatrice, analyst, analyste, specialist, spécialiste, "chief of staff", "project", projet,
                     "program", automation, automatisation, "no-code", "low-code", workflow, implementation,
                     onboarding, strategy, stratégie, "process", processus, planning, solutions, "customer success",
                     partnerships, partenariats, reporting, "business analyst", "supply chain", procurement,
                     achats, logistique, logistics, "chargé de projet", "chargée de projet", "responsable des opérations",
                     "office manager"]
