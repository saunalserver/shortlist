# ---------------------------------------------------------------------------
# autojob search configuration (tracked in git — keep personal data in profile/)
# ---------------------------------------------------------------------------

profile:
  location: "Vancouver, BC"          # used by location-aware sources
  country: CA
  timezone: America/Vancouver
  dashboard_url: "http://localhost:3100/pipeline/jobs"      # digest link; set DASHBOARD_URL in .env for other devices

# Keyword queries used by every keyword-capable source (Adzuna, Jooble, LinkedIn/Indeed,
# Remotive, Himalayas, Job Bank, Serper). Keep them short: boards do fuzzy matching.
# ORDER MATTERS: sources with quotas take the first N — LinkedIn/Indeed 20, Job Bank 8, Jooble 6, Eluta 6,
# Serper its own list below. Reordered 2026-09-02 by volume-to-fit ratio.
queries:
  - operations specialist
  - operations analyst
  - business operations
  - revenue operations
  - operations coordinator
  - implementation specialist
  - business analyst              # high volume, ~half finance/enterprise IT — expect rejections
  - sales operations
  - operations associate
  - customer operations
  # 11+ : reach the uncapped sources (Adzuna, Himalayas, Remotive) and LinkedIn/Indeed up to 20
  - strategy and operations
  - operations manager
  - technical operations
  - business systems analyst
  - operations generalist
  - onboarding specialist
  - technical account manager
  - partner operations
  - program coordinator
  - project coordinator           # heavily construction in Vancouver; see title exclusions (site, trades, civil)
  - data operations
  - process improvement
  - solutions consultant
  - go-to-market operations
  - growth operations
  - chief of staff
  # 2026-09-06: supply-chain family — Vancouver port/logistics market, no query targeted these before
  - supply chain analyst
  - procurement specialist
  - logistics coordinator
  - vendor operations
  # 2026-09-28: titles the new sources showed converting
  - implementation consultant
  - marketing operations
  - product operations
  - support operations
  - sales operations analyst
  # Dropped 2026-09-02: "workflow automation" (a skill, not a title — kept in the career-page title filters),
  # "automation specialist" (in the Lower Mainland this is PLC / controls / building automation work).

scoring:
  min_score_to_queue: 7        # 2026-09-12: 6→7 — 0 applies ever at ≤6, queue was 60% unread 6s. Digest is threshold-driven, so it tightens too.
  # Docs are generated on demand from the dashboard only — no auto-generation (autodoc dropped 2026-09-07).
  # Scorer version. 1 = prompts/scorer.md (the model picks the score). 2 = prompts/scorer_v2.md: the model only
  # extracts facts (role family, duties match, seniority, years, contract, location, signals) and the score is
  # computed in code from `v2:` below — consistent across models, tunable from apply/dismiss data
  # (scripts/eval_scorer.py). 2026-09-28: v1 put 139 jobs at 8 → 5 applied, 129 dismissed.
  version: 1
  v2:
    family_base: { target: 6, adjacent: 4, off: 2 }
    duties_match: { 0: -3, 1: -1, 2: 0, 3: 1 }        # how squarely the day-to-day is the candidate's work
    seniority: { entry: 1, junior: 1, mid: 0, senior: -3, lead: -3, manager: -1, executive: -5 }
    people_manager: -2
    years_required: { le2: 1, eq3: 0, eq4: -1, ge5: -3 }   # ignored when not stated
    missing_must_have: -1                             # per missing hard requirement, max 2
    signals_cap: 2                                    # automation_ai, bilingual_french, tool_overlap, early_career…
    employer: { startup: 1, smb: 1, enterprise: -1, public_sector: 0, unknown: 0 }
  max_llm_calls_per_run: 1000  # hard safety cap — now also the paid-spend ceiling (~$0.3/run worst case)
  # OpenRouter free bucket: 1,000 free-model requests/day for the whole account, resets 17:00 PDT (UTC midnight).
  # llm.py probes GET /api/v1/key before the first call and every `quota_recheck_every` calls (0 disables the
  # probe entirely); at/below the reserve the free models are benched for the rest of the run and the paid
  # fallbacks take over. See free_quota_reserve above.
  free_quota_reserve: 250
  quota_recheck_every: 100
  max_scrapes_per_run: 600    # descriptions fetched from job pages per run (each ~1.5 s)
  # Tried in order; a model is dropped for the rest of the run after repeated quota errors.
  # 2026-09-28 re-benchmark (real scorer prompt, 3 labelled jobs: 1 applied, 2 dismissed-at-8; ~42 live calls):
  # REASONING IS THE SLOWNESS. nemotron-ultra with default reasoning = 35–73 s and ~1–1.5k thinking tokens/job,
  # 12% empty completions (166/1,426 since 09-21); with `reasoning: off` = 4–12 s, 0/9 empty, same verdicts.
  # Dead/dropped: nex-n2.5-pro:free (gone from catalog), nex-n2.5-mini:free (404 "unavailable for free"),
  # nemotron-3.5-lightning:free (217–400 s/job, 6–15k thinking tokens, scored Walmart dept manager 5),
  # nemotron-3-super:free (off → 2/3 empty; on → 36–78 s, lenient), qwen3.7-flash paid (skipped the applied job).
  # Stealth/preview models are avoided on purpose: prompts carry the candidate's profile.
  # 2026-09-29 PAID-FIRST (user call): ~$0.15/day at a few hundred calls/day stretches the ~$9.8 credit ~10 weeks,
  # paid variants have NO platform RPM cap (official limits page) so scoring runs ~1 s/call instead of the free
  # 3 s floor, and no more free-pool 429/empty-completion roulette. Free models are now the backstop; the free
  # bucket (1,000/day) is probed via GET /key — see free_quota_reserve below.
  # lightning vs deepseek-v4-flash-0731 (AA v4.3.2, BenchLM, checked 2026-09-29): 0731 wins raw intelligence
  # 34.5 vs 13.6 — but that's math/coding/agentic, not fixed-rubric classification. Lightning wins speed
  # (356 vs 153 t/s), availability (99.89 vs 99.17%), has published IFEval 68.5 (0731: none), costs less under
  # default routing, and is the only paid model verdict-validated vs the calibration family ("same verdicts as
  # ultra", 09-28 bench; 0731 was lenient on 1 of 3 labelled jobs + documented borderline drift in CTGT study).
  # `workers` threads score in parallel; llm.py paces :free models at ~20 req/min account-wide, paid specs at
  # their own `rpm`.
  workers: 4
  # max_tokens only on reasoning-off models (reasoning tokens would count against it); answers are ~200–600 tokens.
  models:
    - { name: nvidia/nemotron-3.5-lightning,          rpm: 60, reasoning: "off", max_tokens: 2000 }  # PAID PRIMARY ~$0.0003/call: 356 t/s, verdict-identical to ultra
    - { name: nvidia/nemotron-3-ultra-550b-a55b:free, rpm: 20, reasoning: "off", max_tokens: 2000 }  # FREE 2nd (review: keeps fallback verdicts in the calibration family; benched at ≤ reserve)
    - { name: deepseek/deepseek-v4-flash,             rpm: 60, reasoning: "off", max_tokens: 2000 }  # PAID 3rd ~$0.0004/call: cross-family, 2/3 verdicts (lenient on 1) — only if both above fail
    - { name: poolside/laguna-s-2.1:free,             rpm: 20, reasoning: "off", max_tokens: 2000 }  # FREE backstop: 5–7 s, right on 2/2
    - { name: cohere/north-mini-code:free,            rpm: 20 }  # FREE backstop: 11–49 s, lenient on borderline
    - { name: google/gemma-4-31b-it:free,             rpm: 20 }  # FREE backstop (pool saturated at last 2 probes — 0.2 s 429s)
    - { name: openrouter/free,                        rpm: 20 }  # FREE last-ditch (random router — never fires unless 6 models above all fail)
  docs_models:  # docs stay FREE-first: on-demand/rare, and ultra:free is the best prose in the pool; quota probe protects the bucket
    - { name: nvidia/nemotron-3-ultra-550b-a55b:free, rpm: 20 }  # FREE: 550B, best prose in the pool
    - { name: cohere/north-mini-code:free,            rpm: 20 }  # FREE: docs fallback
    - { name: poolside/laguna-s-2.1:free,             rpm: 20 }  # FREE: docs fallback
    - { name: nvidia/nemotron-3.5-lightning,          rpm: 60 }  # PAID fallback when free quota gone

# Shortlisted jobs you have not acted on are retired automatically (status "expired") when they are
# too old to still be open, or when their page says the posting is gone. Runs at the start of each run
# and via `autojob expire`.
expiry:
  posted_max_days: 30          # posting date known (most sources) → expire after this many days
  fetched_max_days: 45         # no posting date → count from the day autojob first saw it
  link_checks_per_run: 60      # active postings whose page is fetched per run (404 / "no longer accepting")

# Digest ranking (2026-10-06, plan item 19): the twice-daily Telegram digest ranks by expected apply, not
# raw score-desc — rank = fit_score + source_prior + freshness bonus − low_confidence penalty − company
# dismissal count. Jobs scored more than 14 days ago and low_confidence rows are left OUT of the digest
# (report 06: nothing unreviewed past ~6 days has ever been applied; low_confidence is 0/41 lifetime) —
# they stay visible in the dashboard queue. Top-15 cap unchanged.
digest_ranking:
  freshness_bonus: 1.0        # full at ≤ 3 days since scored_at, linear decay to 0 at 14 days
  low_confidence_penalty: 1.0
  # Source priors = apply rate among reviewed jobs (applied vs deliberate dismissals at score ≥ 7),
  # scaled to quarter points against the best source. Recompute monthly (next ~2026-11-06):
  #   sqlite3 -readonly data/autojob.db "SELECT source, SUM(user_action='applied') ap,
  #     SUM(user_action='dismissed' AND fit_score>=7) dis FROM jobs
  #     WHERE user_action IS NOT NULL GROUP BY source"
  # 2026-10-06 rates: serper 4/36 · ats_companies 2/20 · wttj 1/4 · adzuna 2/31 · boards 6/125 ·
  # himalayas 2/48 · jooble 0/26 · workday 0/24 · eluta 0/15
  source_priors:
    serper: 1.0               # 11.1% of 36 reviewed — best with a real sample
    ats_companies: 1.0        # 10.0% of 20, and cheapest per queued job (3.6 LLM/queued)
    wttj: 0.75                # 25% of only 4 reviewed — promising, sample too small to crown
    adzuna: 0.5               # 6.5% of 31
    boards: 0.5               # 4.8% of 125
    himalayas: 0.25           # 4.2% of 48
    # every source not listed (jooble, workday, eluta, hn, …) has 0 applies → prior 0.0

# Cheap rule-based rejection BEFORE any LLM call. High precision only — the LLM handles nuance.
prefilter:
  # Titles containing one of these are never dropped by the title rules below ("chief" and "staff" are
  # exclusion words, yet "Chief of Staff" is a target role — every such posting was being thrown away).
  title_allow_phrases:
    - chef de projet              # 2026-09-28: French for project manager ("chef" is an excluded word)
    - cheffe de projet
    - chef·fe de projet
    - operations executive        # UK/EU junior title ("executive" is an excluded word)
    - chief of staff
  # 2026-10-06 review (report 05 §2): planner/buyer/scheduler are excluded words (mostly manufacturing /
  # retail noise), but 28–36% of their kills were the supply-chain family the 09-06 queries target. When the
  # title ALSO names the supply-chain function (title_sc_markers), only those three words stop being
