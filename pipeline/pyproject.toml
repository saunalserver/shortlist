[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autojob"
version = "2.0.0"
description = "Automated job search: fetch from many boards, prefilter, LLM-score against your profile, generate tailored docs on demand, Telegram digest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "openai>=1.40",
    "python-jobspy>=1.1.80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
autojob = "autojob.cli:main"

[tool.setuptools.packages.find]
include = ["autojob*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S608"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
